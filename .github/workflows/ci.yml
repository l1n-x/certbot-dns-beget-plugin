name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: '2.5.1'

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry==$POETRY_VERSION
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: poetry
      - run: poetry check --lock
      - run: poetry install
      - run: poetry run ruff check
      - run: poetry run ruff format --check
      - run: poetry build
      - run: pipx run twine check --strict dist/*

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - run: pipx install poetry==$POETRY_VERSION
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - run: poetry env use python${{ matrix.python-version }}
      - run: poetry install
      - run: poetry run pytest

  test-minimum:
    # Lowest versions allowed by pyproject.toml. certbot 2.0 does not cap its own
    # dependencies, so acme and the crypto libraries are pinned to releases of that time.
    name: Test (minimum dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: >-
          pip install
          certbot==2.0.0
          acme==2.0.0
          requests==2.20.0
          pyOpenSSL==22.1.0
          cryptography==38.0.4
          'josepy<2'
          'pytest>=9.1'
          'pytest-cov>=7.1'
      - run: pip install --no-deps -e .
      - run: pytest
